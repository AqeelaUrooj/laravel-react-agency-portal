services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/laravel-react-agency-portal:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      # Throwaway local development values only. Never use in production.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: agency
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-agency.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agency"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
